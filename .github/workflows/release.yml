name: Release

on:
  push:
    branches: [ main ]

env:
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: 4.2.4

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v${{ env.HELM_VERSION }}

      - run: helm repo add oauth2-proxy https://oauth2-proxy.github.io/manifests

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          config: .cr.yaml
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to ghcr.io
        run: |
          echo "$GITHUB_TOKEN" |
            helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # chart-releaser packages every chart on every run, so the tag for an
      # unchanged chart is already in the registry. Skipping it keeps the
      # published digest stable, the same way skip-existing does for releases.
      - name: Push charts to ghcr.io
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*.tgz; do
            chart="$(helm show chart "$pkg")"
            name="$(awk '/^name:/{print $2}' <<< "$chart")"
            version="$(awk '/^version:/{print $2}' <<< "$chart")"
            if helm show chart "oci://$REGISTRY/$name" --version "$version" >/dev/null 2>&1; then
              echo "skipping $name-$version, already in $REGISTRY"
              continue
            fi
            helm push "$pkg" "oci://$REGISTRY"
          done
        env:
          REGISTRY: ghcr.io/unmango/charts

  release-please:
    name: Release Please
    # Runs after chart-releaser so the <chart>-<version> tag for a just-merged
    # release PR exists before release-please looks for the last release.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # skip-github-release means release-please never relabels a merged
      # release PR, and it aborts while one is still labelled pending. The
      # preceding job's chart-releaser step created the tags, so mark them
      # tagged here or no further release PR is ever opened.
      - name: Mark merged release PRs tagged
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged \
            --label 'autorelease: pending' --json number --jq '.[].number' |
            while read -r pr; do
              gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" \
                --remove-label 'autorelease: pending' \
                --add-label 'autorelease: tagged'
            done
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # A pull request opened with GITHUB_TOKEN does not trigger workflows,
      # so the release PR arrives with no CI. RELEASE_PLEASE_TOKEN is a PAT
      # that fixes that; without one this still works, the release PR just
      # has nothing checking it.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
