name: Release

on:
  push:
    branches: [ main ]

env:
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: 4.2.4

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v${{ env.HELM_VERSION }}

      - run: helm repo add oauth2-proxy https://oauth2-proxy.github.io/manifests

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          config: .cr.yaml
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-please:
    name: Release Please
    # Runs after chart-releaser so the <chart>-<version> tag for a just-merged
    # release PR exists before release-please looks for the last release.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A pull request opened with GITHUB_TOKEN does not trigger workflows,
      # so the release PR arrives with no CI. RELEASE_PLEASE_TOKEN is a PAT
      # that fixes that; without one this still works, the release PR just
      # has nothing checking it.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
