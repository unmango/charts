name: Release

on:
  push:
    branches: [ main ]

env:
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: 4.3.0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v${{ env.HELM_VERSION }}

      - run: helm repo add oauth2-proxy https://oauth2-proxy.github.io/manifests

      # oci_registry_url makes the action run `cr push` after `cr upload`,
      # sending every packaged chart to <registry>/<chart>:<version>.
      # skip_existing covers both: `cr upload` skips existing GitHub releases
      # and `cr push` skips tags already in the registry, so republishing an
      # unchanged chart never replaces its digest.
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          config: .cr.yaml
          skip_existing: true
          oci_registry_url: oci://ghcr.io/unmango/charts
          oci_username: ${{ github.actor }}
          oci_password: ${{ secrets.GITHUB_TOKEN }}
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-please:
    name: Release Please
    # Runs after chart-releaser so the <chart>-<version> tag for a just-merged
    # release PR exists before release-please looks for the last release.
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # A GitHub App token rather than GITHUB_TOKEN, so the release PR triggers
      # CI, and rather than a PAT, so the commits it pushes are signed.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # skip-github-release means release-please never relabels a merged
      # release PR, and it aborts while one is still labelled pending. The
      # preceding job's chart-releaser step created the tags, so mark them
      # tagged here or no further release PR is ever opened.
      - name: Mark merged release PRs tagged
        run: |
          gh pr list --state merged --label 'autorelease: pending' --json number --jq '.[].number' |
            xargs -r -I{} gh pr edit {} --remove-label 'autorelease: pending' --add-label 'autorelease: tagged'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
