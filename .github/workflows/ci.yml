name: CI

on:
  pull_request:
    branches: [main]

env:
  # renovate: datasource=github-releases depName=helm/chart-testing
  CHART_TESTING_VERSION: 3.14.0
  # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
  GATEWAY_API_VERSION: 1.6.2
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: 4.2.4
  # renovate: datasource=github-releases depName=kubernetes-sigs/kind
  KIND_VERSION: 0.33.0
  # renovate: datasource=pypi depName=yamale
  YAMALE_VERSION: 6.1.0
  # renovate: datasource=pypi depName=yamllint
  YAMLLINT_VERSION: 1.38.0

jobs:
  nix:
    runs-on: thecluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            extra-trusted-public-keys = ncps.thecluster.lan:D8fcKW2/D+zjKOABa3bDjEe8x+EPZpXnBDm+XwtNrhI=
            extra-substituters = https://ncps.thecluster.lan

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: unstoppablemango

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - run: nix flake check

      # charts/gharc's templates and values.yaml are generated from the pinned
      # upstream chart and the patches beside them, and committed so that ct,
      # chart-releaser and helm all work against the worktree. Regenerating
      # here is what keeps the two from drifting apart.
      - name: Check charts/gharc is up to date
        run: |
          make chart-gharc
          git diff --exit-code -- charts/gharc

  lint:
    runs-on: thecluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Required by yamale and yamllint
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v${{ env.HELM_VERSION }}

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
        with:
          version: ${{ env.CHART_TESTING_VERSION }}
          yamale_version: ${{ env.YAMALE_VERSION }}
          yamllint_version: ${{ env.YAMLLINT_VERSION }}

      - run: |
          for chart in charts/*; do
            helm dep update "$chart"
          done

      - run: ct lint --config .ct.yaml --github-groups

  test:
    runs-on: thecluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v${{ env.HELM_VERSION }}

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
        with:
          version: ${{ env.CHART_TESTING_VERSION }}
          yamale_version: ${{ env.YAMALE_VERSION }}
          yamllint_version: ${{ env.YAMLLINT_VERSION }}

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1
        with:
          version: v${{ env.KIND_VERSION }}
          config: kind-cluster.yml

      - name: Install Gateway API CRDs
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v${{ env.GATEWAY_API_VERSION }}/standard-install.yaml
          kubectl wait --for=condition=Established --timeout=60s crd/httproutes.gateway.networking.k8s.io

      # hercules-ci-agent can't reach Ready without a real cluster join token
      - run: ct install --config .ct.yaml --all --excluded-charts actions-runner,gharc,hercules-ci-agent --github-groups
