{{- /*
Rendered here rather than from a configmap/ directory like the other charts:
the generated files are multi-line, which a `tpl` over `.Files.Glob.AsConfig`
cannot indent correctly.
*/ -}}
{{- $cfg := dict
  "apiBaseUrl" .Values.agent.apiBaseUrl
  "baseDirectory" "/var/lib/hercules-ci-agent"
  "staticSecretsDirectory" "/etc/hercules-ci-agent/secrets"
  "clusterJoinTokenPath" (printf "/etc/hercules-ci-agent/secrets/%s" .Values.existingSecretKey)
  "logLevel" .Values.agent.logLevel -}}
{{- /* "auto" is a JSON string to the agent, a count is a JSON number */ -}}
{{- $tasks := include "concurrentTasks" . -}}
{{- if eq $tasks "auto" }}{{ $_ := set $cfg "concurrentTasks" $tasks }}
{{- else }}{{ $_ := set $cfg "concurrentTasks" (atoi $tasks) }}{{ end -}}
{{- with .Values.agent.labels }}{{ $_ := set $cfg "labels" . }}{{ end -}}
{{- range $k, $v := .Values.agent.extraSettings }}{{ $_ := set $cfg $k $v }}{{ end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-config" .Release.Name }}
  namespace: {{ .Release.Namespace }}
data:
  agent.json: |
    {{- $cfg | toPrettyJson | nindent 4 }}
  {{- if or .Values.binaryCaches (not .Values.existingSecret) }}
  {{- /* Agent config, not secret material, but the agent reads it from its
         static secrets directory, so the volume projects it back in. */}}
  binary-caches.json: |
    {{- .Values.binaryCaches | toPrettyJson | nindent 4 }}
  {{- end }}
  {{- if or .Values.nixConf .Values.extraNixConf }}
  {{- /* The agent exits with a fatal error on any other narinfo-cache-negative-ttl value */}}
  nix.conf: |
    narinfo-cache-negative-ttl = 0
    {{- range $k, $v := omit .Values.nixConf "narinfo-cache-negative-ttl" }}
    {{ $k }} = {{ $v }}
    {{- end }}
    {{- with .Values.extraNixConf }}
    {{- . | nindent 4 }}
    {{- end }}
  {{- end }}
