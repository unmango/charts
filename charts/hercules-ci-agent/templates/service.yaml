{{/*
The agent only makes outbound connections, so this Service exposes no ports.
It exists to satisfy StatefulSet.spec.serviceName.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    kubernetes.io/app: hercules-ci-agent
