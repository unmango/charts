apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ .Release.Name }}
  selector:
    matchLabels:
      kubernetes.io/app: hercules-ci-agent
  template:
    metadata:
      labels:
        kubernetes.io/app: hercules-ci-agent
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: hercules-ci-agent
          image: {{ include "image" . }}
          env:
            # The image points these at a store path it does not contain
            - name: SSL_CERT_FILE
              value: {{ .Values.caCertFile }}
            - name: NIX_SSL_CERT_FILE
              value: {{ .Values.caCertFile }}
          {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/hercules-ci-agent/agent.json
              subPath: agent.json
              readOnly: true
            {{- if or .Values.nixConf .Values.extraNixConf }}
            - name: config
              mountPath: /etc/nix/nix.conf
              subPath: nix.conf
              readOnly: true
            {{- end }}
            - name: secrets
              mountPath: /etc/hercules-ci-agent/secrets
              readOnly: true
            - name: state
              mountPath: /var/lib/hercules-ci-agent
            - name: tmp
              mountPath: /tmp
          {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if or .Values.effects.enabled .Values.securityContext }}
          securityContext:
            {{- if .Values.effects.enabled }}
            # Effects run in a nested container via crun
            privileged: true
            {{- end }}
            {{- with .Values.securityContext }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ printf "%s-config" .Release.Name }}
        - name: secrets
          secret:
            secretName: {{ include "secretName" . }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpDir.sizeLimit }}
        {{- if not .Values.persistence.enabled }}
        - name: state
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: state
      spec:
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        accessModes:
        {{- range .Values.persistence.accessModes }}
          - {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
{{- end }}
