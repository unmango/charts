# ct lints against this, and githubConfigUrl is required.
githubConfigUrl: https://github.com/unmango/charts
githubConfigSecret:
  github_token: dummy-token-for-linting

# Rendering without a cluster cannot discover the controller's ServiceAccount,
# which the chart otherwise looks up to build its RoleBinding.
controllerServiceAccount:
  namespace: arc-system
  name: arc-gha-rs-controller
