apiVersion: apps/v1
kind: {{ .Values.kind | required "kind is required" }}
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "selectorLabels" . | nindent 6 }}
  {{- if eq .Values.kind "StatefulSet" }}
  serviceName: {{ .Release.Name }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "labels" . | nindent 8 }}
    spec:
      containers:
        - name: deemix
          image: {{ include "image" . }}
          ports:
            - name: http
              containerPort: 6595
          env:
            - name: PUID
              value: {{ .Values.global.uid | quote }}
            - name: PGID
              value: {{ .Values.global.gid | quote }}
            - name: DEEMIX_SINGLE_USER
              value: {{ .Values.singleUser | quote }}
            {{- if .Values.disableOwnershipCheck }}
            - name: DISABLE_OWNERSHIP_CHECK
              value: {{ .Values.disableOwnershipCheck | quote }}
            {{- end }}
            - name: UMASK_SET
              value: {{ .Values.umask | quote }}
        {{- if or .Values.existingConfigMap .Values.persistence.downloads.enabled .Values.persistence.config.enabled (lt 0 (len .Values.extraVolumeMounts)) }}
          volumeMounts:
          {{- if .Values.existingConfigMap }}
            - name: config-json
              mountPath: /config/config.json
              subPath: config.json
              readOnly: true
          {{- else }}
            - name: config
              mountPath: /config
          {{- end }}
          {{- if .Values.persistence.downloads.enabled }}
            - name: downloads
              mountPath: /downloads
          {{- end }}
          {{- if lt 0 (len .Values.extraVolumeMounts) }}
            {{ .Values.extraVolumeMounts | toYaml | nindent 12 }}
          {{- end }}
        {{- end }}
          readinessProbe:
            httpGet:
              port: http
              path: /
            initialDelaySeconds: 5
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              port: http
              path: /
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 120
            successThreshold: 1
        {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      securityContext:
        fsGroup: {{ .Values.global.gid }}
      {{- if or .Values.existingConfigMap (lt 0 (len .Values.extraVolumes)) }}
      volumes:
      {{- if .Values.existingConfigMap }}
        - name: config-json
          configMap:
            name: {{ .Values.existingConfigMap }}
      {{- else if not .Values.persistence.config.enabled }}
        - name: config
          emptyDir:
            sizeLimit: 250Mi
      {{- end }}
        {{- .Values.extraVolumes | toYaml | nindent 8 }}
      {{- end }}
      dnsConfig:
        options:
          - name: ndots
            value: '2'
{{- if eq .Values.kind "StatefulSet" }}
  volumeClaimTemplates:
  {{- if .Values.persistence.config.enabled }}
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: config
      spec:
        storageClassName: {{ .Values.persistence.config.storageClassName }}
        accessModes:
        {{- range .Values.persistence.config.accessModes }}
          - {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.config.size }}
  {{- end }}
  {{- if .Values.persistence.downloads.enabled }}
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: downloads
      spec:
        storageClassName: {{ .Values.persistence.downloads.storageClassName }}
        accessModes:
        {{- range .Values.persistence.downloads.accessModes }}
          - {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.downloads.size }}
  {{- end }}
{{- end }}
