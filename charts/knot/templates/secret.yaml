{{- if not .Values.masterKey.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "masterKey.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels" . | nindent 4 }}
  annotations:
    # Deleting the key orphans every repository DID the knot has signed for
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.masterKey.key }}: {{ include "masterKey.value" . | quote }}
{{- end }}
