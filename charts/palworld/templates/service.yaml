apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and (eq .Values.service.type "LoadBalancer") (.Values.service.loadBalancerIP) }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  selector:
    {{- include "selectorLabels" . | nindent 4 }}
  ports:
    - name: server
      port: {{ .Values.server.port }}
      targetPort: server
      protocol: UDP
    - name: query
      port: {{ .Values.server.queryPort }}
      targetPort: query
      protocol: UDP
    {{- if .Values.server.restApi.enabled }}
    - name: rest
      port: {{ .Values.server.restApi.port }}
      targetPort: rest
    {{- end }}
